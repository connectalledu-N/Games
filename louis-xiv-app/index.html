<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Louis XIV — CM1 History Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --gold:#d4af37; --blue:#1e3a8a; --red:#b91c1c; --cream:#fdf6e3;
  --purple:#5b21b6; --green:#15803d;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(180deg,#fdf6e3,#f3e5ab 40%,#e8d48a);
  min-height:100vh; color:#2a1a05;
}
header{
  background:linear-gradient(90deg,#1e3a8a,#5b21b6);
  color:#fff; padding:14px 18px; display:flex; align-items:center; gap:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.3); position:sticky; top:0; z-index:50;
  flex-wrap:wrap;
}
header h1{margin:0; font-size:1.25rem; flex:1;}
header h1 span{display:block; font-size:.75rem; font-weight:400; opacity:.85;}
nav{display:flex; gap:6px; flex-wrap:wrap;}
nav button{
  background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.4);
  color:#fff; padding:7px 12px; border-radius:20px; cursor:pointer;
  font-size:.85rem; font-weight:600; transition:.2s;
}
nav button:hover, nav button.active{background:var(--gold); color:#3a2400; border-color:var(--gold);}
main{max-width:1000px; margin:0 auto; padding:20px 14px 60px;}
.view{display:none;}
.view.active{display:block; animation:fadein .3s;}
@keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.hero{
  background:#fff; border:3px solid var(--gold); border-radius:18px; padding:22px;
  text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.12); margin-bottom:20px;
}
.hero .crown{font-size:3rem;}
.hero h2{margin:6px 0; color:var(--blue);}
.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
.tile{
  background:#fff; border-radius:14px; padding:16px; box-shadow:0 4px 10px rgba(0,0,0,.1);
  border-left:6px solid var(--gold); cursor:pointer; transition:.2s;
}
.tile:hover{transform:translateY(-3px); box-shadow:0 8px 16px rgba(0,0,0,.18);}
.tile h3{margin:0 0 6px; color:var(--blue);}
.tile p{margin:0; font-size:.85rem; color:#555;}
.pill{display:inline-block; background:var(--gold); color:#3a2400; font-weight:700; font-size:.7rem; border-radius:10px; padding:2px 8px; margin-bottom:6px;}

/* FLASHCARDS */
.deck-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.deck-tabs button{
  background:#fff; border:2px solid var(--blue); color:var(--blue); padding:6px 14px;
  border-radius:20px; cursor:pointer; font-weight:700;
}
.deck-tabs button.active{background:var(--blue); color:#fff;}
.flash-area{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;}
.flashcard{
  perspective:1000px; height:190px; cursor:pointer;
}
.flashcard .inner{
  position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;
}
.flashcard.flipped .inner{transform:rotateY(180deg);}
.face{
  position:absolute; width:100%; height:100%; backface-visibility:hidden;
  border-radius:14px; padding:14px; display:flex; flex-direction:column; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.18); text-align:center;
}
.face.front{background:linear-gradient(160deg,#1e3a8a,#3b5bdb); color:#fff;}
.face.back{background:linear-gradient(160deg,#d4af37,#f3d56b); color:#3a2400; transform:rotateY(180deg);}
.face .tag{font-size:.65rem; text-transform:uppercase; opacity:.8; margin-bottom:6px;}
.face .main{font-size:1.15rem; font-weight:700;}
.face .sub{font-size:.85rem; margin-top:6px; font-style:italic;}
.face .hint{font-size:.7rem; margin-top:8px; opacity:.85;}

/* TIMELINE */
.timeline{position:relative; padding-left:30px; border-left:4px solid var(--gold); margin-top:10px;}
.tl-item{position:relative; margin-bottom:22px; background:#fff; border-radius:12px; padding:12px 16px; box-shadow:0 3px 8px rgba(0,0,0,.1);}
.tl-item::before{
  content:"👑"; position:absolute; left:-44px; top:10px; background:var(--gold);
  border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:.9rem;
  box-shadow:0 0 0 4px #fdf6e3;
}
.tl-year{font-weight:800; color:var(--red); font-size:1.1rem;}
.tl-en{margin:4px 0 2px;}
.tl-fr{color:var(--purple); font-weight:600;}

/* EXPLORER */
.qcard{background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 3px 8px rgba(0,0,0,.1); border-top:5px solid var(--blue);}
.qcard .pagetag{background:var(--blue); color:#fff; font-size:.7rem; padding:2px 8px; border-radius:8px; margin-right:6px;}
.qcard .frq{color:var(--purple); font-weight:700; margin:8px 0 2px;}
.qcard .enq{color:#444; font-style:italic; margin-bottom:8px;}
.toggle-ans{background:var(--gold); border:none; padding:6px 12px; border-radius:10px; cursor:pointer; font-weight:700;}
.answer{display:none; margin-top:8px; background:#fdf6e3; border-radius:10px; padding:10px;}
.answer.show{display:block;}
.img-illustration{
  border-radius:12px; padding:14px; margin-bottom:10px; color:#fff; font-weight:600; text-align:center;
  background:linear-gradient(135deg,var(--blue),var(--purple));
}

/* QUIZ */
.level-select{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.level-select button{flex:1; min-width:160px; padding:14px; border-radius:14px; border:3px solid var(--blue); background:#fff; cursor:pointer; font-weight:800; font-size:1rem;}
.level-select button.active{background:var(--blue); color:#fff;}
.quiz-box{background:#fff; border-radius:16px; padding:20px; box-shadow:0 4px 14px rgba(0,0,0,.15);}
.qprog{font-size:.8rem; color:#666; margin-bottom:8px;}
.qtext-en{font-size:1.05rem; font-weight:700; color:var(--blue);}
.qtext-fr{font-size:.95rem; color:var(--purple); margin-bottom:14px;}
.options{display:grid; gap:10px;}
.opt{background:#fdf6e3; border:2px solid #e3c97a; padding:10px 14px; border-radius:10px; cursor:pointer; text-align:left; font-size:.95rem;}
.opt:hover{background:#f3e0a5;}
.opt.correct{background:#bbf7d0; border-color:var(--green);}
.opt.wrong{background:#fecaca; border-color:var(--red);}
.fillrow{display:flex; gap:8px; margin-top:6px;}
.fillrow input{flex:1; padding:10px; border-radius:10px; border:2px solid var(--purple); font-size:1rem;}
.fillrow button{padding:10px 16px; border-radius:10px; border:none; background:var(--blue); color:#fff; font-weight:700; cursor:pointer;}
.feedback{margin-top:12px; padding:10px; border-radius:10px; font-weight:600;}
.feedback.ok{background:#bbf7d0; color:#14532d;}
.feedback.bad{background:#fecaca; color:#7f1d1d;}
.nextbtn{margin-top:14px; background:var(--gold); border:none; padding:10px 20px; border-radius:10px; font-weight:800; cursor:pointer;}
.scoreboard{text-align:center;}
.scoreboard .big{font-size:3rem;}

/* BADGES */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
.badge{background:#fff; border-radius:14px; padding:16px; text-align:center; box-shadow:0 3px 8px rgba(0,0,0,.1); opacity:.35;}
.badge.unlocked{opacity:1; border:3px solid var(--gold);}
.badge .ico{font-size:2.4rem;}
.badge h4{margin:6px 0 2px; font-size:.9rem;}
.badge p{font-size:.7rem; color:#666; margin:0;}
.progressbar{background:#eee; border-radius:10px; height:14px; overflow:hidden; margin:10px 0;}
.progressbar .fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--red)); width:0%; transition:.4s;}

footer{text-align:center; padding:14px; font-size:.75rem; color:#7a5a20;}
.parent-note{background:#fff7e0; border:2px dashed var(--gold); border-radius:12px; padding:12px; font-size:.85rem; margin:14px 0;}
</style>
</head>

/* ============================== STATE / STORAGE ============================== */
const ST_KEY = "louisxiv_app_state_v1";
function loadState(){
  try{ return JSON.parse(localStorage.getItem(ST_KEY)) || {}; }catch(e){ return {}; }
}
function saveState(s){ localStorage.setItem(ST_KEY, JSON.stringify(s)); }
let state = Object.assign({
  badges:{}, quiz1Best:0, quiz2Best:0, flashSeen:{}, explorerSeen:{}
}, loadState());

function unlockBadge(id){
  if(!state.badges[id]){ state.badges[id]=true; saveState(state); showToast("🏅 New badge unlocked!"); }
}
function showToast(msg){
  let t=document.createElement('div');
  t.textContent=msg;
  t.style.position='fixed'; t.style.bottom='20px'; t.style.left='50%'; t.style.transform='translateX(-50%)';
  t.style.background='#1e3a8a'; t.style.color='#fff'; t.style.padding='12px 22px'; t.style.borderRadius='30px';
  t.style.boxShadow='0 4px 14px rgba(0,0,0,.3)'; t.style.zIndex=999; t.style.fontWeight='700';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

let currentDeck = "people";
function renderFlash(){
  main.innerHTML = `
   <h2>🃏 Flashcards — Level 1 (direct facts)</h2>
   <p><b>EN:</b> Click a card to flip it. Front = question/topic (English). Back = the fact, with the French word/name she needs to know &amp; how to spell it.</p>
   <div class="deck-tabs" id="deckTabs">
     <button data-deck="people" class="active">👑 People</button>
     <button data-deck="dates">📅 Dates</button>
     <button data-deck="vocab">📖 Vocabulary</button>
     <button data-deck="places">🏛️ Places</button>
   </div>
   <div class="flash-area" id="flashArea"></div>
  `;
  document.getElementById('deckTabs').addEventListener('click', e=>{
    if(!e.target.dataset.deck) return;
    currentDeck = e.target.dataset.deck;
    document.querySelectorAll('#deckTabs button').forEach(b=>b.classList.toggle('active', b.dataset.deck===currentDeck));
    drawDeck();
  });
  drawDeck();
}
function drawDeck(){
  const area = document.getElementById('flashArea');
  let data, frontFn, backFn, key;
  if(currentDeck==="people"){
    data=PEOPLE; key="people";
    frontFn=p=>`<div class="tag">${p.tag}</div><div class="icon" style="font-size:2rem;">${p.icon}</div><div class="main">Who is this?</div>`;
    backFn=p=>`<div class="tag">FR name</div><div class="main">${p.fr}</div><div class="sub">${p.en}</div>`;
  } else if(currentDeck==="dates"){
    data=TIMELINE; key="dates";
    frontFn=p=>`<div class="tag">Year</div><div class="main" style="font-size:2rem;">${p.year}</div><div class="hint">What happened?</div>`;
    backFn=p=>`<div class="tag">FR</div><div class="sub" style="color:#3a2400;">${p.fr}</div><div class="hint" style="color:#3a2400;">${p.en}</div>`;
  } else if(currentDeck==="vocab"){
    data=VOCAB; key="vocab";
    frontFn=p=>`<div class="tag">English meaning</div><div class="main" style="font-size:.95rem;">${p.en}</div>`;
    backFn=p=>`<div class="tag">French word — spell it!</div><div class="main">${p.fr}</div><div class="sub">${p.spell}</div>`;
  } else {
    data=PLACES; key="places";
    frontFn=p=>`<div class="icon" style="font-size:2rem;">${p.icon}</div><div class="main">Where / what is this?</div>`;
    backFn=p=>`<div class="tag">FR</div><div class="main">${p.fr}</div><div class="sub">${p.en}</div>`;
  }
  area.innerHTML = data.map((p,i)=>`
    <div class="flashcard" data-i="${i}">
      <div class="inner">
        <div class="face front">${frontFn(p)}</div>
        <div class="face back">${backFn(p)}</div>
      </div>
    </div>
  `).join('');
  area.querySelectorAll('.flashcard').forEach(card=>{
    card.addEventListener('click', ()=>{
      card.classList.toggle('flipped');
      const i = card.dataset.i;
      state.flashSeen[key] = state.flashSeen[key]||{};
      state.flashSeen[key][i]=true;
      saveState(state);
      checkDeckBadge(key, data.length);
    });
  });
}
function checkDeckBadge(key, total){
  const seen = state.flashSeen[key] ? Object.keys(state.flashSeen[key]).length : 0;
  if(seen>=total){
    if(key==="people") unlockBadge("flash_people");
    if(key==="dates") unlockBadge("flash_dates");
    if(key==="vocab") unlockBadge("flash_vocab");
  }
}

/* ---- QUIZ ---- */
let quizState = null;
function renderQuizHome(){
  main.innerHTML = `
   <h2>🧠 Quiz Time</h2>
   <p><b>EN:</b> Choose a level. Level 1 = direct recall (multiple choice). Level 2 = harder — image/document-based + typing French spelling + ordering events.</p>
   <div class="level-select" id="lvlSelect">
     <button data-lvl="1">🌟 Level 1<br><small>Direct facts (15 Q)</small></button>
     <button data-lvl="2">🔥 Level 2<br><small>Fun &amp; tricky (12 Q)</small></button>
   </div>
   <div id="quizHost"></div>
  `;
  document.getElementById('lvlSelect').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#lvlSelect button').forEach(x=>x.classList.toggle('active', x===b));
    startQuiz(parseInt(b.dataset.lvl));
  });
}
function startQuiz(lvl){
  quizState = {lvl, idx:0, score:0, total: lvl===1?QUIZ1.length:QUIZ2.length};
  drawQuizQuestion();
}
function normalize(str){
  return str.toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function drawQuizQuestion(){
  const host = document.getElementById('quizHost');
  const set = quizState.lvl===1 ? QUIZ1 : QUIZ2;
  if(quizState.idx >= set.length){ return drawQuizSummary(); }
  const q = set[quizState.idx];
  let bodyHTML = "";

  if(quizState.lvl===1 || q.type==="mcq"){
    bodyHTML = `<div class="options">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  } else if(q.type==="fill"){
    bodyHTML = `<div class="fillrow"><input type="text" id="fillInput" placeholder="Écris ta réponse en français..."><button id="fillBtn">Valider</button></div>`;
  } else if(q.type==="order"){
    bodyHTML = `<div class="options">` + q.items.map((it,i)=>`
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="number" min="1" max="${q.items.length}" style="width:50px; padding:6px; border-radius:8px; border:2px solid var(--purple);" data-i="${i}" class="orderInput">
          <span>${it.label_fr} <i style="color:#888;">(${it.label_en})</i></span>
        </div>`).join('') + `</div><button class="nextbtn" id="orderSubmit" style="margin-top:14px;">Valider l'ordre</button>`;
  }

  host.innerHTML = `
    <div class="quiz-box">
      <div class="qprog">Question ${quizState.idx+1} / ${set.length} — Score: ${quizState.score}</div>
      <div class="qtext-en">${q.q_en}</div>
      <div class="qtext-fr">🇫🇷 ${q.q_fr}</div>
      ${bodyHTML}
      <div id="qFeedback"></div>
    </div>
  `;

  if(quizState.lvl===1 || q.type==="mcq"){
    host.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        host.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        const correct = parseInt(btn.dataset.i)===q.a;
        btn.classList.add(correct?'correct':'wrong');
        if(!correct) host.querySelectorAll('.opt')[q.a].classList.add('correct');
        if(correct) quizState.score++;
        feedbackAndNext(correct, q.opts ? q.opts[q.a] : "");
      });
    });
  } else if(q.type==="fill"){
    const submit = ()=>{
      const val = document.getElementById('fillInput').value;
      const correct = normalize(val)===normalize(q.answer);
      if(correct) quizState.score++;
      feedbackAndNext(correct, q.answer);
    };
    document.getElementById('fillBtn').addEventListener('click', submit);
    document.getElementById('fillInput').addEventListener('keypress', e=>{ if(e.key==='Enter') submit(); });
  } else if(q.type==="order"){
    document.getElementById('orderSubmit').addEventListener('click', ()=>{
      const inputs = host.querySelectorAll('.orderInput');
      let correctCount=0;
      inputs.forEach((inp,i)=>{
        const val = parseInt(inp.value);
        if(val===q.items[i].correctPos) correctCount++;
      });
      const allCorrect = correctCount===q.items.length;
      if(allCorrect) quizState.score++;
      const correctOrderText = q.items.map(it=>it.correctPos+". "+it.label_fr).join(' | ');
      feedbackAndNext(allCorrect, correctOrderText);
    });
  }
}
function feedbackAndNext(correct, correctAnswerText){
  const fb = document.getElementById('qFeedback');
  fb.innerHTML = `
    <div class="feedback ${correct?'ok':'bad'}">
      ${correct ? "✅ Correct ! Bravo !" : `❌ Pas tout à fait. Réponse correcte : <b>${correctAnswerText}</b>`}
    </div>
    <button class="nextbtn" id="nextQ">Suivant ➜ Next</button>
  `;
  document.getElementById('nextQ').addEventListener('click', ()=>{
    quizState.idx++;
    drawQuizQuestion();
  });
}
function drawQuizSummary(){
  const host = document.getElementById('quizHost');
  const pct = Math.round(100*quizState.score/quizState.total);
  host.innerHTML = `
    <div class="quiz-box scoreboard">
      <div class="big">${quizState.score===quizState.total ? "🏆" : pct>=60 ? "🎉" : "💪"}</div>
      <h2>Score: ${quizState.score} / ${quizState.total} (${pct}%)</h2>
      <p>${pct===100 ? "Perfect! Roi-Soleil level achieved!" : pct>=60 ? "Great job — keep practicing!" : "Good try — revise the Flashcards &amp; Explorer, then try again!"}</p>
      <button class="nextbtn" onclick="renderQuizHome()">⬅ Back to quiz menu</button>
    </div>
  `;
  if(quizState.lvl===1){
    state.quiz1Best = Math.max(state.quiz1Best||0, quizState.score);
    if(quizState.score>=10) unlockBadge("quiz1_pass");
    if(quizState.score>=quizState.total) unlockBadge("quiz1_perfect");
  } else {
    state.quiz2Best = Math.max(state.quiz2Best||0, quizState.score);
    if(quizState.score>=9) unlockBadge("quiz2_pass");
    if(quizState.score>=quizState.total) unlockBadge("quiz2_perfect");
  }
  saveState(state);
}

   <div class="badge-grid">
     ${BADGES.map(b=>`
       <div class="badge ${state.badges[b.id]?'unlocked':''}">
         <div class="ico">${state.badges[b.id]?b.ico:'🔒'}</div>
         <h4>${b.name}</h4>
         <p>${b.desc}</p>
       </div>
     `).join('')}
   </div>
  `;
}
